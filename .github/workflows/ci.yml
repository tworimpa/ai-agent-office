name: CI (Windows + Linux)

on:
  pull_request:
  push:
    branches: [main, feature/ao-000-bootstrap]

permissions:
  contents: read

jobs:
  tests:
    name: '${{ matrix.os }} / Python ${{ matrix.python-version }}'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install project
        run: python -m pip install -e '.[dev]'
      - uses: actions/setup-node@v4
        with:
          node-version: '26'
          cache: npm
      - name: Install frontend test dependencies
        run: npm ci
      - name: Frontend state and DOM tests
        run: npm run test:web
      - name: Compile source
        run: python -m compileall -q src tests
      - name: Unit and subprocess smoke tests
        run: python -m pytest -q
      - name: CLI command help
        run: python -m agent_office.cli --help
      - name: Doctor (no vendor credentials required)
        run: python -m agent_office.cli doctor --require
