name: CI (Windows + Linux)

on:
  pull_request:
  push:
    branches: [main, feature/ao-000-bootstrap]

permissions:
  contents: read

jobs:
  tests:
    name: '${{ matrix.os }} / Python ${{ matrix.python-version }}'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install project
        run: python -m pip install -e '.[dev]'
      - uses: actions/setup-node@v4
        with:
          node-version: '26'
          cache: npm
      - name: Install frontend test dependencies
        run: npm ci
      - name: Frontend state and DOM tests
        run: npm run test:web
      - name: Check shared frontend contracts
        run: npm run check:web
      - name: Verify real Node, Go and Cargo project checks
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.11'
        run: |
          python -c "import shutil; from agent_office.goal_checks import _unprivileged; assert _unprivileged() and all(shutil.which(x) for x in ('node','npm','go','cargo')), 'Expected an ordinary Linux runner with the project toolchains'"
          python -m pytest -q -rA tests/test_project_checks.py
      - name: Verify bundled offline flowchart renderer
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.11'
        run: |
          npm run build:flow
          git diff --exit-code -- src/agent_office/web/mermaid-flow-renderer.js
      - name: Compile source
        run: python -m compileall -q src tests
      - name: Deploy and recover a disposable Windows NSSM Studio in Edge
        if: matrix.os == 'windows-latest' && matrix.python-version == '3.13' && runner.environment == 'github-hosted'
        shell: pwsh
        env:
          OFFICE_NSSM_ACCEPTANCE: '1'
          OFFICE_SPLIT_ACL_ACCEPTANCE: '1'
        run: |
          $scratch = New-Item -ItemType Directory -Path (Join-Path $env:RUNNER_TEMP "office-nssm-$([guid]::NewGuid())")
          $zip = Join-Path $scratch.FullName "nssm.zip"
          try {
            Invoke-WebRequest 'https://nssm.cc/ci/nssm-2.24-101-g897c7ad.zip' -OutFile $zip -TimeoutSec 25
          } catch {
            $package = Join-Path $scratch.FullName "nssm.nupkg"
            Invoke-WebRequest 'https://community.chocolatey.org/api/v2/package/nssm/2.24.101' -OutFile $package -TimeoutSec 25
            $archive = [IO.Compression.ZipFile]::OpenRead($package)
            try {
              [IO.Compression.ZipFileExtensions]::ExtractToFile(
                $archive.GetEntry("tools/nssm-2.24-101-g897c7ad.zip"), $zip, $true)
            } finally {
              $archive.Dispose()
            }
          }
          if ((Get-FileHash $zip -Algorithm SHA256).Hash -ne '99F5045FFFBFFB745D67FE3A065A953C4A3D9C253B868892D9B685B0EE7D07B8') {
            throw "NSSM archive SHA-256 mismatch"
          }
          Expand-Archive -LiteralPath $zip -DestinationPath $scratch.FullName
          $env:OFFICE_NSSM_EXE = Join-Path $scratch.FullName 'nssm-2.24-101-g897c7ad/win64/nssm.exe'
          python -m pip install pywinpty==3.0.2 playwright==1.55.0
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m pytest -q -rA tests/test_deployment_nssm.py tests/test_split_session_host_ci.py
      - name: Unit and subprocess smoke tests
        run: python -m pytest -q
      - name: Isolated release validator with real Docker
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.13'
        env:
          OFFICE_DOCKER_ACCEPTANCE: '1'
        run: python -m pytest -q tests/test_release_validation.py tests/test_improvement_cli.py tests/test_improvement_http.py
      - name: Deploy and recover a disposable systemd Studio with a separate service user
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.13' && runner.environment == 'github-hosted'
        shell: bash
        run: |
          runtime_python="$(python -c 'import sys; print(sys.executable)')"
          sudo -n env OFFICE_SYSTEMD_ACCEPTANCE=1 OFFICE_DOCKER_ACCEPTANCE=1 PYTHONDONTWRITEBYTECODE=1 \
            PYTHONPATH="$PWD/src" "$runtime_python" -m pytest -q -p no:cacheprovider tests/test_deployment_systemd.py
      - name: CLI command help
        run: python -m agent_office.cli --help
      - name: Doctor (no vendor credentials required)
        run: python -m agent_office.cli doctor --require
