name: Rust comparison installers
on: workflow_call
permissions:
  contents: read
jobs:
  verify:
    name: '${{ matrix.os }} / Rust comparison'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 50
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Prepare Studio independent of both installers
        run: python -m pip install .
      - uses: actions/setup-node@v4
        with:
          node-version: '26'
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - uses: actions/download-artifact@v4
        with:
          pattern: desktop-receipt-${{ runner.os }}-*
          path: desktop-receipts
      - id: receipt
        run: node desktop/checksum.mjs select desktop-receipts
      - uses: actions/download-artifact@v4
        with:
          artifact-ids: ${{ steps.receipt.outputs.artifact_id }}
          merge-multiple: true
          path: electron-installer
      - name: Verify the installer used in the desktop checks
        env:
          INSTALLER_SHA256: ${{ steps.receipt.outputs.installer_sha256 }}
        run: node desktop/checksum.mjs verify electron-installer
      - name: Set up Linux WebView and WebDriver
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          driver=webkit2gtk-driver
          if apt-cache show webkitgtk-webdriver >/dev/null 2>&1; then driver=webkitgtk-webdriver; fi
          sudo apt-get install -y --no-install-recommends libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf "$driver" xvfb xauth dbus-x11 ibus-hangul ibus-gtk3 xdotool
      - run: npm ci --prefix desktop
      - run: node --test rust-desktop/pin-journal.test.mjs
      - run: rustup update stable --no-self-update
      - run: cargo +stable install tauri-driver --version 2.1.0 --locked
      - name: Compile and test desktop shell
        working-directory: rust-desktop
        env:
          RUSTUP_TOOLCHAIN: stable
        run: cargo test --release --locked
      - name: Package Rust installer
        working-directory: rust-desktop
        env:
          RUSTUP_TOOLCHAIN: stable
        run: npx --yes --package=@tauri-apps/cli@2.12.6 tauri build --bundles ${{ runner.os == 'Windows' && 'nsis' || 'deb' }} -- --locked
      - name: Install both Windows apps and verify the surviving Electron journal
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/ci-rust-coexistence.ps1
      - name: Install both Ubuntu apps and verify the surviving Electron journal
        if: runner.os == 'Linux'
        run: bash scripts/ci-rust-coexistence.sh
      - name: Keep Rust installer and verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rust-comparison-${{ runner.os }}
          overwrite: true
          path: |
            rust-desktop/target/release/bundle/nsis/*setup.exe
            rust-desktop/target/release/bundle/deb/*.deb
            comparison-evidence
          retention-days: 7
