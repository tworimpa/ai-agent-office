name: Desktop installers

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  actions: read

jobs:
  desktop:
    name: '${{ matrix.os }} desktop installer'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '26'
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: '0.12.3'
      - run: npm ci --prefix desktop
      - run: npm test --prefix desktop
      - id: build
        run: npm run package --prefix desktop
      - name: Publish the tested standalone Windows operator runtime
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: split-operator-runtime-Windows
          path: desktop/build/runtime/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7
      - name: Share Electron installer with coexistence checks
        id: upload
        uses: actions/upload-artifact@v4
        with:
          name: electron-installer-${{ runner.os }}
          path: |
            desktop/dist/${{ steps.build.outputs.installer_name }}
            desktop/dist/SHA256SUMS.txt
          overwrite: true
          if-no-files-found: error
          retention-days: 7
      - name: Fetch the uploaded installer by ID for installation
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_ID: ${{ steps.upload.outputs.artifact-id }}
          ARTIFACT_DIGEST: ${{ steps.upload.outputs.artifact-digest }}
          INSTALLER_NAME: ${{ steps.build.outputs.installer_name }}
        run: python scripts/desktop_artifact.py electron-installer
      - name: Verify the downloaded installer and build checksum
        env:
          INSTALLER_SHA256: ${{ steps.build.outputs.installer_sha256 }}
        run: node desktop/checksum.mjs verify electron-installer
      - name: Install and verify the Windows desktop app
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          INSTALLER_NAME: ${{ steps.build.outputs.installer_name }}
        run: |
          $installer = (Get-Item -LiteralPath (Join-Path 'electron-installer' $env:INSTALLER_NAME)).FullName
          $installed = Start-Process -FilePath $installer -ArgumentList '/S' -WindowStyle Hidden -Wait -PassThru
          if ($installed.ExitCode -ne 0) { exit $installed.ExitCode }
          $shortcut = Join-Path ([Environment]::GetFolderPath('Programs')) 'AI Agent Office.lnk'
          $exe = (New-Object -ComObject WScript.Shell).CreateShortcut($shortcut).TargetPath
          node desktop/verify-install.mjs $exe
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          node desktop/verify-chat.mjs $exe (Join-Path $env:RUNNER_TEMP 'office-chat-evidence') --verify-bootstrap
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          $principal = [Security.Principal.WindowsPrincipal]::new([Security.Principal.WindowsIdentity]::GetCurrent())
          $mode = if ($principal.IsInRole([Security.Principal.WindowsBuiltInRole]::Administrator)) { 'privilege-gate' } else { 'after' }
          node desktop/verify-goal.mjs $exe (Join-Path $env:RUNNER_TEMP 'office-goal-evidence') $mode
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          $githubMode = if ($mode -eq 'privilege-gate') { 'github-gate' } else { 'github' }
          node desktop/verify-goal.mjs $exe (Join-Path $env:RUNNER_TEMP 'office-github-evidence') $githubMode
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          if ($mode -eq 'after') {
            node desktop/verify-goal.mjs $exe (Join-Path $env:RUNNER_TEMP 'office-briefing-evidence') briefing-after
          } else {
            Write-Host 'Repository pytest is gated in elevated sessions. The Linux regular-user job exercises the full briefing journey.'
          }
      - name: Install and verify the Linux desktop app
        if: runner.os == 'Linux'
        env:
          INSTALLER_NAME: ${{ steps.build.outputs.installer_name }}
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends "./electron-installer/$INSTALLER_NAME" xvfb xauth
          test -f /usr/share/applications/ai-agent-office-desktop.desktop
          xvfb-run -a node desktop/verify-install.mjs /usr/bin/ai-agent-office-desktop
          xvfb-run -a node desktop/verify-chat.mjs /usr/bin/ai-agent-office-desktop "$RUNNER_TEMP/office-chat-evidence" --verify-bootstrap
      - name: Verify goals in a regular Linux desktop user's session
        if: runner.os == 'Linux'
        run: |
          sudo useradd --create-home --user-group --shell /bin/bash office-goal-ci
          tools=$(mktemp -d /tmp/office-goal-ci.XXXXXXXX)
          chmod 0755 "$tools"
          mkdir -p "$tools/node_modules" "$tools/fixtures"
          install -m 0755 "$(command -v node)" "$tools/node"
          cp desktop/{verify-goal,verify-briefing,verify-lifecycle,studio}.mjs "$tools/"
          cp desktop/fixtures/{goal_worker.py,briefing_worker.py,github_tls.py,github-provider.mjs} "$tools/fixtures/"
          cp -R desktop/node_modules/{playwright,playwright-core} "$tools/node_modules/"
          evidence="$tools/evidence"
          sudo install -d -o office-goal-ci -g office-goal-ci "$evidence"
          capture() {
            mkdir -p "$RUNNER_TEMP/office-goal-evidence"
            sudo cp -a "$evidence/." "$RUNNER_TEMP/office-goal-evidence/"
            sudo chown -R "$(id -u):$(id -g)" "$RUNNER_TEMP/office-goal-evidence"
          }
          trap capture EXIT
          # Exercise the installed coordinator as the ordinary user who owns the worktree.
          packages=()
          [[ -x /usr/bin/cargo && -x /usr/bin/rustc ]] || packages+=(cargo rustc)
          [[ -x /usr/bin/go ]] || packages+=(golang-go)
          [[ -x /usr/bin/npm && -x /usr/bin/node ]] || packages+=(npm)
          if (( ${#packages[@]} )); then
            sudo apt-get install -y --no-install-recommends "${packages[@]}"
          fi
          cp tests/{test_project_checks,test_goal_verification}.py "$tools/"
          runtime="$(dirname "$(readlink -f /usr/bin/ai-agent-office-desktop)")/resources/runtime/bin/python3"
          sudo --login --user office-goal-ci env PATH=/usr/bin:/bin "$runtime" -I -c "import shutil; from agent_office.goal_checks import _unprivileged; assert _unprivileged() and all(shutil.which(x) for x in ('node','npm','go','cargo'))"
          sudo --login --user office-goal-ci env PATH=/usr/bin:/bin "$runtime" -I -m pytest -q -rA -p no:cacheprovider "$tools/test_project_checks.py"
          sudo --login --user office-goal-ci xvfb-run -a "$tools/node" "$tools/verify-goal.mjs" /usr/bin/ai-agent-office-desktop "$evidence" after
          sudo --login --user office-goal-ci xvfb-run -a "$tools/node" "$tools/verify-goal.mjs" /usr/bin/ai-agent-office-desktop "$evidence/github" github
          sudo --login --user office-goal-ci xvfb-run -a "$tools/node" "$tools/verify-goal.mjs" /usr/bin/ai-agent-office-desktop "$evidence/briefing" briefing-after
      - name: Record the installer that passed the desktop checks
        env:
          ARTIFACT_ID: ${{ steps.upload.outputs.artifact-id }}
          ARTIFACT_DIGEST: ${{ steps.upload.outputs.artifact-digest }}
          INSTALLER_SHA256: ${{ steps.build.outputs.installer_sha256 }}
        run: node desktop/checksum.mjs receipt electron-installer
      - name: Upload the verified installer receipt for this attempt
        uses: actions/upload-artifact@v4
        with:
          name: desktop-receipt-${{ runner.os }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/receipt.json
          if-no-files-found: error
          retention-days: 7
      - name: Keep the fixture report and screen captures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: goal-journey-${{ runner.os }}
          path: |
            ${{ runner.temp }}/office-goal-evidence
            ${{ runner.temp }}/office-github-evidence
            ${{ runner.temp }}/office-briefing-evidence
          if-no-files-found: ignore
          retention-days: 7

  rust-comparison:
    needs: desktop
    uses: ./.github/workflows/rust-comparison.yml
