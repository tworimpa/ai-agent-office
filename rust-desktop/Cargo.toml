[package]
name = "ai-agent-office-rust"
version = "0.7.0"
description = "실행 중인 AI Agent Office Studio에 연결하는 Rust 비교판"
authors = ["AI Agent Office <maintainers@users.noreply.github.com>"]
edition = "2021"
license = "Apache-2.0"
publish = false

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
open = { version = "5.4.5", features = ["shellexecute-on-windows"] }
reqwest = { version = "0.12", default-features = false, features = ["blocking"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2.12", features = [] }
tempfile = "3"
url = "2"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
