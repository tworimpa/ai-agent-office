[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-agent-office"
version = "0.1.0"
description = "Local-first multi-CLI coding agent office bootstrap"
readme = "README.md"
license = {file = "LICENSE"}
requires-python = ">=3.11"
dependencies = [
  "PyYAML>=6",
  "cryptography>=46",
  "pywin32>=306; sys_platform == 'win32'",
  "langgraph>=1.0,<2",
  "langgraph-checkpoint-sqlite>=2.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "jsonschema>=4.18"]

[project.scripts]
agent-office = "agent_office.cli:main"
agent-office-runtime = "agent_office.managed_runtime:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
agent_office = ["web/*.html", "web/*.css", "web/*.js", "web/*.webp", "web/bot-art/*.webp", "schemas/*.json", "examples/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
